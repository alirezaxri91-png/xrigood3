<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xrigood - مهارت‌ها</title>
<link href="https://fonts.googleapis.com/css2?family=Yekan+Bakh+Fa&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1724; --card:#0b1220; --muted:#a5b4c4; 
  --accent1:#ffd54a; --accent2:#60c47a; --glass: rgba(255,255,255,0.05);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Yekan Bakh Fa',system-ui;direction:rtl;background:linear-gradient(135deg,#071028,#0f1724);color:#e6eef8;padding:32px;}
.wrap{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:30px;}
header{display:flex;align-items:center;gap:20px;margin-bottom:20px;}
.avatar{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--accent1),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;color:#022;box-shadow:0 12px 40px rgba(0,0,0,0.6);cursor:pointer;overflow:hidden;}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
h1{font-size:28px;margin-bottom:4px;cursor:pointer;}
p.lead{color:var(--muted);font-size:14px;cursor:pointer;}
.card{background:var(--glass);backdrop-filter:blur(12px);border-radius:20px;padding:24px;box-shadow:0 12px 40px rgba(2,6,23,0.7);border:1px solid rgba(255,255,255,0.08);}
.skills{position:relative;}
.skill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:20px;margin-top:20px;}
.skill-container{display:flex;align-items:center;gap:10px;}
.skill{position:relative;width:120px;height:120px;background:rgba(255,255,255,0.02);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:transform 0.3s;}
.skill:hover{transform:scale(1.05);}
.progress{width:110px;height:110px;display:grid;place-items:center;position:relative;}
.progress svg{transform:rotate(-90deg);}
.progress .label{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.pct{font-weight:800;font-size:18px;}
.skill-name{font-size:13px;color:var(--muted);margin-top:6px;text-align:center;}
.btns{display:flex;flex-direction:column;gap:4px;}
.btns button{padding:3px 6px;border-radius:6px;border:none;font-size:12px;cursor:pointer;transition:all 0.2s;color:#fff;}
.delete-btn{background:#ff4d4d;}
.delete-btn:hover{background:#ff1a1a;}
.edit-btn{background:#4dc2ff;}
.edit-btn:hover{background:#1aa3ff;}
.note-btn{background:#ffb84d;}
.note-btn:hover{background:#ff9a1a;}
input,button,textarea{padding:8px 12px;border-radius:12px;background:rgba(255,255,255,0.08);border:none;color:#fff;outline:none;}
button:hover{background:rgba(255,255,255,0.15);}
#welcomeOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,36,0.95);display:flex;align-items:center;justify-content:center;z-index:1000;flex-direction:column;gap:20px;}
#welcomeOverlay input{width:240px;text-align:center;}
</style>
</head>
<body>

<div id="welcomeOverlay">
  <h2>خوش آمدید به xrigood!</h2>
  <input id="inputName" placeholder="اسم خودت را وارد کن">
  <input id="inputDesc" placeholder="توضیحات کوتاه">
  <input id="inputAvatar" placeholder="لینک عکس پروفایل">
  <button id="saveProfileBtn">ذخیره و ورود</button>
</div>

<div class="wrap" style="display:none;">
<header class="card">
  <div class="avatar" id="profileAvatar">
    <img src="https://via.placeholder.com/90" alt="پروفایل">
  </div>
  <div>
    <h1 id="profileName">نام خودت</h1>
    <p class="lead" id="profileDesc">توضیحات خودت را اینجا بنویس</p>
  </div>
</header>

<h2 style="color:#ffd54a;">xrigood</h2>

<div class="card skills">
<h3>مهارت‌ها</h3>
<div class="skill-grid" id="skills"></div>
<div style="margin-top:16px;display:flex;gap:12px;">
  <input id="skillName" placeholder="نام مهارت">
  <input id="skillPct" placeholder="درصد">
  <input id="skillImg" placeholder="لینک عکس (اختیاری)">
  <button id="addSkill">افزودن</button>
</div>
</div>
</div>

<script>
// صفحه خوش‌آمدگویی و بارگذاری پروفایل
function checkFirstVisit(){
  if(localStorage.getItem('profileName')){
    document.getElementById('welcomeOverlay').style.display='none';
    document.querySelector('.wrap').style.display='grid';
    loadProfile();
    loadData();
  }
}
checkFirstVisit();

document.getElementById('saveProfileBtn').onclick=()=>{
  const name=document.getElementById('inputName').value||'نام خودت';
  const desc=document.getElementById('inputDesc').value||'توضیحات خودت را اینجا بنویس';
  const avatar=document.getElementById('inputAvatar').value||'https://via.placeholder.com/90';
  localStorage.setItem('profileName',name);
  localStorage.setItem('profileDesc',desc);
  localStorage.setItem('profileAvatar',avatar);
  document.getElementById('profileName').textContent=name;
  document.getElementById('profileDesc').textContent=desc;
  document.getElementById('profileAvatar').querySelector('img').src=avatar;
  document.getElementById('welcomeOverlay').style.display='none';
  document.querySelector('.wrap').style.display='grid';
  loadData();
}

function loadProfile(){
  const n=localStorage.getItem('profileName');
  const d=localStorage.getItem('profileDesc');
  const a=localStorage.getItem('profileAvatar');
  if(n) document.getElementById('profileName').textContent=n;
  if(d) document.getElementById('profileDesc').textContent=d;
  if(a) document.getElementById('profileAvatar').querySelector('img').src=a;
}

// ویرایش زنده پروفایل
document.getElementById('profileName').onclick=()=>{
  const newName=prompt('اسم خودت را وارد کن:',document.getElementById('profileName').textContent);
  if(newName){document.getElementById('profileName').textContent=newName;localStorage.setItem('profileName',newName);}
};
document.getElementById('profileDesc').onclick=()=>{
  const newDesc=prompt('توضیحات خودت را وارد کن:',document.getElementById('profileDesc').textContent);
  if(newDesc){document.getElementById('profileDesc').textContent=newDesc;localStorage.setItem('profileDesc',newDesc);}
};
document.getElementById('profileAvatar').onclick=()=>{
  const newUrl=prompt('لینک عکس پروفایل را وارد کن:',document.getElementById('profileAvatar').querySelector('img').src);
  if(newUrl){document.getElementById('profileAvatar').querySelector('img').src=newUrl;localStorage.setItem('profileAvatar',newUrl);}
}

// مهارت‌ها
function saveData(){
  localStorage.setItem('skills',document.getElementById('skills').innerHTML)
}
function loadData(){
  document.getElementById('skills').innerHTML=localStorage.getItem('skills')||'';
  Array.from(document.querySelectorAll('.delete-btn')).forEach(btn=>{btn.onclick=()=>{btn.closest('.skill-container').remove();saveData();}});
  Array.from(document.querySelectorAll('.edit-btn')).forEach(btn=>{btn.onclick=()=>editSkill(btn.closest('.skill-container'));});
  Array.from(document.querySelectorAll('.note-btn')).forEach(btn=>{btn.onclick=()=>openNote(btn.closest('.skill-container'));});
  Array.from(document.querySelectorAll('.progress')).forEach(p=>animateProgress(p));
}

function animateProgress(el){
  const pct=parseInt(el.getAttribute('data-percentage')||0);
  const svgBar=el.querySelector('.bar');
  const label=el.querySelector('.pct');
  const r=48; const c=Math.PI*(r*2); let start=null;
  function step(ts){
    if(!start)start=ts;
    const t=Math.min(1,(ts-start)/1000);
    const current=Math.round(t*pct);
    const currentDash=(current/100)*c;
    svgBar.style.strokeDasharray=currentDash+' '+c;
    label.textContent=current+'%';
    if(t<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function createSkill(name,pct,img=''){
  const container=document.createElement('div');
  container.className='skill-container';
  let imgTag = img?`<img src="${img}" style="width:40px;height:40px;border-radius:50%;margin-bottom:4px;">`:''; 
  container.innerHTML=`<div class="skill">
    <div class="progress" data-percentage="${pct}">
      <svg width="110" height="110">
        <circle cx="55" cy="55" r="48" stroke="rgba(255,255,255,0.06)" stroke-width="12" fill="none"></circle>
        <circle class="bar" cx="55" cy="55" r="48" stroke-linecap="round" stroke-width="12" stroke="#ffd54a" stroke-dasharray="0 1000" fill="none"></circle>
      </svg>
      <div class="label">${imgTag}<div class="pct">0%</div><div class="skill-name">${name}</div></div>
    </div>
  </div>
  <div class="btns">
    <button class='note-btn'>📝</button>
    <button class='edit-btn'>🖊️</button>
    <button class='delete-btn'>🗑️</button>
  </div>`;
  container.querySelector('.delete-btn').onclick=()=>{container.remove();saveData();};
  container.querySelector('.edit-btn').onclick=()=>editSkill(container);
  container.querySelector('.note-btn').onclick=()=>openNote(container);
  document.getElementById('skills').appendChild(container);
  animateProgress(container.querySelector('.progress'));
  saveData();
}

function editSkill(container){
  let currentName = container.querySelector('.skill-name').textContent;
  let currentPct = container.querySelector('.progress').getAttribute('data-percentage');
  let currentImg = container.querySelector('.label img')?container.querySelector('.label img').src:'';
  let newName = prompt("نام مهارت:", currentName);
  let newPct = prompt("درصد مهارت:", currentPct);
  let newImg = prompt("لینک عکس (اختیاری):", currentImg);
  if(newName!==null && newPct!==null){
    container.querySelector('.skill-name').textContent = newName;
    container.querySelector('.progress').setAttribute('data-percentage',parseInt(newPct));
    let imgTag = newImg?`<img src="${newImg}" style="width:40px;height:40px;border-radius:50%;margin-bottom:4px;">`:'';
    container.querySelector('.label').innerHTML = imgTag+`<div class="pct">0%</div><div class="skill-name">${newName}</div>`;
    animateProgress(container.querySelector('.progress'));
    saveData();
  }
}

function openNote(container){
  let skillName = container.querySelector('.skill-name').textContent;
  let key = 'note_'+skillName;
  let noteContent = localStorage.getItem(key)||'';
  let noteWindow = window.open('','_blank','width=400,height=400');
  noteWindow.document.write(`
    <title>یادداشت ${skillName}</title>
    <body style="background:#0f1724;color:#e6eef8;font-family:sans-serif;padding:20px;">
      <h2>یادداشت ${skillName}</h2>
      <textarea id="noteText" style="width:100%;height:70%;background:#1a1a1a;color:#fff;padding:8px;border-radius:8px;border:none;">${noteContent}</textarea>
      <br><button id="saveBtn" style="margin-top:12px;padding:8px 12px;border-radius:8px;background:#ffd54a;border:none;color:#022;cursor:pointer;">ذخیره</button>
    </body>
  `);
  noteWindow.document.getElementById('saveBtn').onclick=()=>{
    let text = noteWindow.document.getElementById('noteText').value;
    localStorage.setItem(key,text);
    alert('ذخیره شد ✅');
  };
}

document.getElementById('addSkill').onclick=()=>{
  let n=document.getElementById('skillName').value||'مهارت جدید';
  let p=parseInt(document.getElementById('skillPct').value)||0;
  let i=document.getElementById('skillImg').value||'';
  createSkill(n,p,i);
  document.getElementById('skillName').value='';
  document.getElementById('skillPct').value='';
  document.getElementById('skillImg').value='';
}

loadData();
</script>
</body>
</html>
